<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In - Victory Life CMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        /* ============================================
           LOGIN PAGE SPECIFIC STYLES
        ============================================ */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
            padding: 20px;
            margin: 0;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-brand .brand-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            margin: 0 auto 12px;
        }

        .login-brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }

        .login-brand p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow-lg);
        }

        .login-card .login-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text);
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 10px 14px;
            padding-right: 44px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .form-group .input-wrapper input.error {
            border-color: var(--danger);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
        }

        .form-group .input-wrapper .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .form-group .input-wrapper .toggle-password:hover {
            color: var(--text);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .form-options .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .form-options .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .form-options .forgot-link {
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .form-options .forgot-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .btn-signin {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-signin:hover {
            background: var(--primary-hover);
        }

        .btn-signin:active {
            transform: scale(0.98);
        }

        .btn-signin:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-signin .spinner {
            display: none;
            animation: spin 0.8s linear infinite;
        }

        .btn-signin.loading .spinner {
            display: inline-block;
        }

        .btn-signin.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .login-error {
            display: none;
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-sm);
            color: var(--danger);
            font-size: 0.85rem;
            text-align: center;
        }

        .login-error.show {
            display: block;
        }

        .login-success {
            display: none;
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: var(--radius-sm);
            color: var(--success);
            font-size: 0.85rem;
            text-align: center;
        }

        .login-success.show {
            display: block;
        }

        .login-footer {
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .version-info {
            text-align: center;
            margin-top: 24px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Rate limit warning */
        .rate-limit-warning {
            display: none;
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: var(--radius-sm);
            color: var(--warning);
            font-size: 0.85rem;
            text-align: center;
        }

        .rate-limit-warning.show {
            display: block;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px;
            }
            .login-brand .brand-icon {
                width: 52px;
                height: 52px;
                font-size: 1.6rem;
            }
            .login-brand h1 {
                font-size: 1.2rem;
            }
            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="login-page">
        <div class="login-container">

            <!-- Brand -->
            <div class="login-brand">
                <div class="brand-icon">✝</div>
                <h1>Victory Life</h1>
                <p>Church Management System</p>
            </div>

            <!-- Login Card -->
            <div class="login-card">

                <h2 class="login-title">Sign In</h2>

                <form id="loginForm" autocomplete="off" novalidate>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <div class="input-wrapper">
                            <input
                                type="email"
                                id="loginEmail"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            />
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            />
                            <button
                                type="button"
                                class="toggle-password"
                                id="togglePassword"
                                aria-label="Toggle password visibility"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe" />
                            <span>Remember me</span>
                        </label>
                        <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn-signin" id="signInBtn">
                        <span class="spinner"><i class="fas fa-spinner"></i></span>
                        <span class="btn-text">Sign In</span>
                    </button>

                    <!-- Error / Success / Rate Limit -->
                    <div id="loginError" class="login-error"></div>
                    <div id="loginSuccess" class="login-success"></div>
                    <div id="rateLimitWarning" class="rate-limit-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        Too many failed attempts. Please wait 15 minutes.
                    </div>

                </form>

                <div class="login-footer">
                    Don't have an account? <a href="register.html">Create one</a>
                </div>

            </div>

            <div class="version-info">
                Victory Life CMS v2.0 &bull; Secure Connection
            </div>

        </div>
    </div>

    <script>
        // ============================================
        // DOM REFERENCES
        // ============================================
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const rememberMe = document.getElementById('rememberMe');
        const togglePassword = document.getElementById('togglePassword');
        const signInBtn = document.getElementById('signInBtn');
        const errorEl = document.getElementById('loginError');
        const successEl = document.getElementById('loginSuccess');
        const rateLimitEl = document.getElementById('rateLimitWarning');

        // ============================================
        // STATE
        // ============================================
        let loginAttempts = 0;
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_TIME = 15 * 60 * 1000; // 15 minutes
        let lockoutUntil = localStorage.getItem('loginLockoutUntil')
            ? parseInt(localStorage.getItem('loginLockoutUntil'))
            : 0;

        // ============================================
        // TOGGLE PASSWORD VISIBILITY
        // ============================================
        togglePassword.addEventListener('click', function() {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            this.innerHTML = isPassword ?
                '<i class="fas fa-eye-slash"></i>' :
                '<i class="fas fa-eye"></i>';
        });

        // ============================================
        // REMEMBER ME - Load saved email
        // ============================================
        (function loadRememberedEmail() {
            try {
                const saved = localStorage.getItem('rememberedEmail');
                if (saved) {
                    emailInput.value = saved;
                    rememberMe.checked = true;
                }
            } catch (e) {
                // Ignore
            }
        })();

        // ============================================
        // CHECK LOCKOUT STATUS
        // ============================================
        (function checkLockout() {
            if (lockoutUntil > Date.now()) {
                const remaining = Math.ceil((lockoutUntil - Date.now()) / 60000);
                rateLimitEl.textContent =
                    'Too many failed attempts. Please wait ' + remaining + ' minutes.';
                rateLimitEl.classList.add('show');
                signInBtn.disabled = true;
            } else {
                // Clear lockout if expired
                localStorage.removeItem('loginLockoutUntil');
                lockoutUntil = 0;
            }
        })();

        // ============================================
        // REAL-TIME VALIDATION
        // ============================================
        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validatePassword(password) {
            return password.length >= 8;
        }

        function clearFieldError(input) {
            input.classList.remove('error');
        }

        function setFieldError(input) {
            input.classList.add('error');
        }

        emailInput.addEventListener('blur', function() {
            if (this.value && !validateEmail(this.value)) {
                setFieldError(this);
            } else {
                clearFieldError(this);
            }
        });

        emailInput.addEventListener('input', function() {
            if (this.value && !validateEmail(this.value)) {
                setFieldError(this);
            } else {
                clearFieldError(this);
            }
        });

        passwordInput.addEventListener('blur', function() {
            if (this.value && !validatePassword(this.value)) {
                setFieldError(this);
            } else {
                clearFieldError(this);
            }
        });

        passwordInput.addEventListener('input', function() {
            if (this.value && !validatePassword(this.value)) {
                setFieldError(this);
            } else {
                clearFieldError(this);
            }
        });

        // ============================================
        // FORM SUBMISSION
        // ============================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Clear previous messages
            errorEl.classList.remove('show');
            successEl.classList.remove('show');
            rateLimitEl.classList.remove('show');

            // Check lockout
            if (lockoutUntil > Date.now()) {
                const remaining = Math.ceil((lockoutUntil - Date.now()) / 60000);
                rateLimitEl.textContent =
                    'Too many failed attempts. Please wait ' + remaining + ' minutes.';
                rateLimitEl.classList.add('show');
                return;
            }

            // Get values
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Validate
            if (!email || !password) {
                errorEl.textContent = 'Please enter both email and password.';
                errorEl.classList.add('show');
                return;
            }

            if (!validateEmail(email)) {
                errorEl.textContent = 'Please enter a valid email address.';
                errorEl.classList.add('show');
                setFieldError(emailInput);
                return;
            }

            if (!validatePassword(password)) {
                errorEl.textContent = 'Password must be at least 8 characters.';
                errorEl.classList.add('show');
                setFieldError(passwordInput);
                return;
            }

            // Show loading
            signInBtn.classList.add('loading');
            signInBtn.disabled = true;

            try {
                // Call login API
                const response = await fetch('https://church-cms-api-11h5.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Invalid credentials.');
                }

                // Login successful
                loginAttempts = 0;

                // Store session
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Remember me
                if (rememberMe.checked) {
                    localStorage.setItem('rememberedEmail', email);
                } else {
                    localStorage.removeItem('rememberedEmail');
                }

                // Clear any lockout
                localStorage.removeItem('loginLockoutUntil');

                // Show success
                successEl.textContent = 'Login successful. Redirecting...';
                successEl.classList.add('show');

                // Reset loading state
                signInBtn.classList.remove('loading');
                signInBtn.disabled = false;

                // Redirect to dashboard
                setTimeout(function() {
                    window.location.href = '../dashboard/index.html';
                }, 800);

            } catch (error) {
                // Login failed
                loginAttempts++;

                // Check for lockout
                if (loginAttempts >= MAX_ATTEMPTS) {
                    lockoutUntil = Date.now() + LOCKOUT_TIME;
                    localStorage.setItem('loginLockoutUntil', lockoutUntil.toString());
                    rateLimitEl.textContent = 'Too many failed attempts. Please wait 15 minutes.';
                    rateLimitEl.classList.add('show');
                    signInBtn.disabled = true;
                }

                errorEl.textContent = error.message || 'Login failed. Please try again.';
                errorEl.classList.add('show');

                // Reset loading state
                signInBtn.classList.remove('loading');
                signInBtn.disabled = false;

                // Focus on email for retry
                emailInput.focus();
            }
        });

        // ============================================
        // ENTER KEY SUPPORT (Already handled by form)
        // ============================================

        // ============================================
        // CHECK IF ALREADY LOGGED IN
        // ============================================
        (function checkExistingSession() {
            try {
                const token = localStorage.getItem('token');
                const user = localStorage.getItem('user');
                if (token && user) {
                    // Already logged in, redirect to dashboard
                    window.location.href = '../dashboard/index.html';
                }
            } catch (e) {
                // Ignore
            }
        })();

        // ============================================
        // RATE LIMIT RESET ON SUCCESSFUL LOGIN
        // ============================================
        // The lockout resets on successful login above

        console.log('🔐 Victory Life CMS - Secure Login');
        console.log('ℹ️  Max login attempts: ' + MAX_ATTEMPTS);
        console.log('ℹ️  Lockout duration: 15 minutes');
    </script>

</body>
</html>
