<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Victory Life CMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);padding:20px;margin:0;">

    <div style="width:100%;max-width:400px;">

        <div style="text-align:center;margin-bottom:32px;">
            <div style="width:64px;height:64px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;margin:0 auto 12px;">✝</div>
            <h1 style="font-size:1.5rem;font-weight:700;color:var(--text);">Victory Life</h1>
            <p style="color:var(--text-secondary);">Church Management System</p>
        </div>

        <div class="card" style="padding:32px;">
            <h2 style="font-size:1.2rem;margin-bottom:20px;color:var(--text);">Sign In</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label style="color:var(--text);">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="admin@church.com" value="admin@church.com" required>
                </div>
                <div class="form-group">
                    <label style="color:var(--text);">Password</label>
                    <div style="position:relative;">
                        <input type="password" id="loginPassword" placeholder="Enter your password" value="password123" required style="padding-right:44px;">
                        <button type="button" id="togglePassword" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text-secondary);cursor:pointer;padding:8px;font-size:1rem;">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div style="text-align:center;margin-top:12px;">
    <a href="register.html" style="color:var(--primary);text-decoration:none;font-size:0.9rem;">
        Don't have an account? Register
    </a>
</div>
                <button type="submit" class="btn-primary" style="width:100%;justify-content:center;padding:12px;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div id="loginError" style="display:none;margin-top:12px;padding:10px;background:rgba(239,68,68,0.1);border-radius:6px;color:var(--danger);text-align:center;font-size:0.9rem;"></div>

            <div style="text-align:center;margin-top:16px;font-size:0.85rem;color:var(--text-secondary);">
                Demo: admin@church.com / password123
            </div>
        </div>
    </div>

    <script src="../../assets/js/data.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        // ============================================
        // PASSWORD TOGGLE
        // ============================================
        document.getElementById('togglePassword').addEventListener('click', function() {
            var passwordInput = document.getElementById('loginPassword');
            var icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });

        // ============================================
        // LOGIN FORM
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');

            errorEl.style.display = 'none';

            if (!email || !password) {
                errorEl.textContent = 'Please enter both email and password.';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const result = await login(email, password);
                window.location.href = '../dashboard/index.html';
            } catch (error) {
                errorEl.textContent = error.message || 'Invalid credentials. Please try again.';
                errorEl.style.display = 'block';
            }
        });

        // ============================================
        // ENTER KEY SUPPORT
        // ============================================
        document.getElementById('loginPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
