<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Victory Life CMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);">

    <div style="width:100%;max-width:400px;padding:20px;">
        <div style="text-align:center;margin-bottom:32px;">
            <div style="width:64px;height:64px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;margin:0 auto 12px;">✝</div>
            <h1 style="font-size:1.5rem;font-weight:700;">Reset Password</h1>
            <p style="color:var(--text-secondary);">Enter your email to reset your password</p>
        </div>

        <div class="card" style="padding:32px;">
            <form>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="admin@church.com" required>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;justify-content:center;">
                    <i class="fas fa-envelope"></i> Send Reset Link
                </button>
            </form>

            <div style="text-align:center;margin-top:16px;">
                <a href="login.html" style="color:var(--primary);text-decoration:none;font-size:0.9rem;">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

</body>
</html>
