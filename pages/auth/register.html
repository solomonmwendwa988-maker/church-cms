<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Victory Life CMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);padding:20px;margin:0;">

    <div style="width:100%;max-width:400px;">

        <div style="text-align:center;margin-bottom:32px;">
            <div style="width:64px;height:64px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;margin:0 auto 12px;">✝</div>
            <h1 style="font-size:1.5rem;font-weight:700;color:var(--text);">Victory Life</h1>
            <p style="color:var(--text-secondary);">Create your account</p>
        </div>

        <div class="card" style="padding:32px;">
            <h2 style="font-size:1.2rem;margin-bottom:20px;color:var(--text);">Register</h2>

            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="john@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div style="position:relative;">
                        <input type="password" id="regPassword" placeholder="Min 6 characters" required minlength="6" style="padding-right:44px;">
                        <button type="button" id="toggleRegPassword" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text-secondary);cursor:pointer;padding:8px;font-size:1rem;">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;justify-content:center;padding:12px;">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div id="registerError" style="display:none;margin-top:12px;padding:10px;background:rgba(239,68,68,0.1);border-radius:6px;color:var(--danger);text-align:center;font-size:0.9rem;"></div>

            <div style="text-align:center;margin-top:16px;">
                <a href="login.html" style="color:var(--primary);text-decoration:none;font-size:0.9rem;">
                    Already have an account? Sign In
                </a>
            </div>
        </div>
    </div>

    <script>
        // Password toggle
        document.getElementById('toggleRegPassword').addEventListener('click', function() {
            var passwordInput = document.getElementById('regPassword');
            var icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });

        // Registration form
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const errorEl = document.getElementById('registerError');

            errorEl.style.display = 'none';

            if (!name || !email || !password) {
                errorEl.textContent = 'Please fill in all fields.';
                errorEl.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters.';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('https://church-cms-api-11h5.onrender.com/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role: 'member' })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Registration failed');
                }

                alert('✅ Registration successful! Please login.');
                window.location.href = 'login.html';

            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
