<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Finance Record - Victory Life CMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="#" class="brand">
                <div class="logo-icon">✝</div>
                <span>Victory <span class="highlight">Life</span></span>
            </a>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="showNotification()" title="Notifications">
                <i class="fas fa-bell"></i>
                <span class="dot active" id="notifDot"></span>
            </button>
            <button class="header-btn" onclick="toggleTheme()" title="Toggle Theme" id="themeBtn">
                <i class="fas fa-moon"></i>
            </button>
            <a href="../auth/login.html" class="header-btn" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </a>
        </div>
    </header>

    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <button class="nav-item" data-page="dashboard" onclick="window.location.href='../dashboard/index.html'">
                <i class="fas fa-chart-pie"></i> Dashboard
            </button>
            <button class="nav-item" data-page="members" onclick="window.location.href='../members/index.html'">
                <i class="fas fa-users"></i> Members
                <span class="badge" id="memberBadge">0</span>
            </button>
            <button class="nav-item" data-page="attendance" onclick="window.location.href='../attendance/index.html'">
                <i class="fas fa-clipboard-check"></i> Attendance
            </button>
            <button class="nav-item active" data-page="finance" onclick="window.location.href='index.html'">
                <i class="fas fa-coins"></i> Finance
                <span class="badge" id="financeBadge">0</span>
            </button>
            <button class="nav-item" data-page="events" onclick="window.location.href='../events/index.html'">
                <i class="fas fa-calendar-alt"></i> Events
                <span class="badge" id="eventBadge">0</span>
            </button>
            <button class="nav-item" data-page="reports" onclick="window.location.href='../reports/index.html'">
                <i class="fas fa-file-alt"></i> Reports
            </button>
            <button class="nav-item" data-page="settings" onclick="window.location.href='../settings/index.html'">
                <i class="fas fa-cog"></i> Settings
            </button>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="user-avatar">AD</div>
                <div class="user-info">
                    <span class="user-name">Admin User</span>
                    <span class="user-role">Administrator</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="topbar">
            <button class="menu-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div>
                <span class="page-title" id="pageTitle">Record Giving</span>
                <span class="page-subtitle" id="pageSubtitle">Record a new giving or offering</span>
            </div>
        </div>

        <div class="card">
            <form id="financeForm">
                <input type="hidden" id="recordId" value="">
                <input type="hidden" id="recordType" value="giving">

                <div class="form-group">
                    <label>Record Type</label>
                    <select id="typeSelect" onchange="toggleFinanceForm()">
                        <option value="giving">Giving / Offering</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <div id="givingFields">
                    <div class="form-group">
                        <label>Member</label>
                        <select id="memberSelect">
                            <option value="">Select Member</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="givingCategory">
                            <option value="Tithe">Tithe</option>
                            <option value="Offering">Offering</option>
                            <option value="Pledge">Pledge</option>
                            <option value="Building Fund">Building Fund</option>
                            <option value="Missions">Missions</option>
                            <option value="Benevolence">Benevolence</option>
                        </select>
                    </div>
                </div>

                <div id="expenseFields" style="display:none;">
                    <div class="form-group">
                        <label>Expense Category</label>
                        <select id="expenseCategory">
                            <option value="Utilities">Utilities</option>
                            <option value="Salaries">Salaries</option>
                            <option value="Maintenance">Maintenance</option>
                            <option value="Equipment">Equipment</option>
                            <option value="Missions">Missions</option>
                            <option value="Outreach">Outreach</option>
                            <option value="Administrative">Administrative</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="expenseDescription" placeholder="What was this expense for?">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" step="0.01" id="amount" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select id="paymentMethod">
                            <option value="Cash">Cash</option>
                            <option value="M-Pesa">M-Pesa</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Card">Card</option>
                            <option value="Cheque">Cheque</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Receipt Number</label>
                        <input type="text" id="receiptNumber" placeholder="Auto-generated">
                    </div>
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" placeholder="Additional notes..."></textarea>
                </div>

                <div style="display:flex;gap:12px;margin-top:8px;">
                    <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save Record</button>
                    <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
            </form>
        </div>

        <div class="footer">
            Victory Life International &bull; Church Management System v2.0
        </div>
    </main>

    <div id="toastContainer"></div>
    <script>
    // ============================================
    // AUTHENTICATION CHECK - RUNS FIRST
    // ============================================
    (function checkAuth() {
        // If not authenticated, redirect to login
        if (!isAuthenticated()) {
            window.location.href = '../auth/login.html';
            return;
        }

        // Update user info in sidebar
        var user = getCurrentUser();
        if (user) {
            var avatarEl = document.getElementById('userAvatar');
            var nameEl = document.getElementById('userName');
            var roleEl = document.getElementById('userRole');

            if (avatarEl) avatarEl.textContent = user.avatar || user.name.charAt(0).toUpperCase();
            if (nameEl) nameEl.textContent = user.name || 'Admin User';
            if (roleEl) roleEl.textContent = user.role ? user.role.charAt(0).toUpperCase() + user.role.slice(1) : 'Administrator';

            var subtitleEl = document.getElementById('pageSubtitle');
            if (subtitleEl) subtitleEl.textContent = 'Welcome back, ' + (user.name || 'Admin');
        }
    })();
</script>
    <script src="../../assets/js/data.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        // ============================================
        // POPULATE MEMBER SELECT
        // ============================================
        function populateMembers() {
            const members = DB.getAll('members');
            const select = document.getElementById('memberSelect');
            if (!select) return;

            let options = '<option value="">Select Member</option>';

            members.forEach(function(m) {
                if (m.status === 'Active') {
                    options += '<option value="' + m.id + '">' + m.firstName + ' ' + m.lastName + ' (' + (m.phone || 'N/A') + ')</option>';
                }
            });

            select.innerHTML = options;
        }

        // ============================================
        // SET DEFAULT DATE
        // ============================================
        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
        }

        // ============================================
        // TOGGLE FORM FIELDS
        // ============================================
        function toggleFinanceForm() {
            var type = document.getElementById('typeSelect').value;
            var givingFields = document.getElementById('givingFields');
            var expenseFields = document.getElementById('expenseFields');
            var pageTitle = document.getElementById('pageTitle');
            var pageSubtitle = document.getElementById('pageSubtitle');

            if (type === 'giving') {
                givingFields.style.display = 'block';
                expenseFields.style.display = 'none';
                pageTitle.textContent = 'Record Giving';
                pageSubtitle.textContent = 'Record a new giving or offering';
                document.getElementById('recordType').value = 'giving';
            } else {
                givingFields.style.display = 'none';
                expenseFields.style.display = 'block';
                pageTitle.textContent = 'Record Expense';
                pageSubtitle.textContent = 'Record a new expense';
                document.getElementById('recordType').value = 'expense';
            }
        }

        // ============================================
        // LOAD EDIT DATA
        // ============================================
        function loadEditData() {
            var urlParams = new URLSearchParams(window.location.search);
            var type = urlParams.get('type') || 'giving';
            var editId = urlParams.get('id');

            if (editId) {
                document.getElementById('pageTitle').textContent = 'Edit Record';
                document.getElementById('pageSubtitle').textContent = 'Update finance record';

                if (type === 'giving') {
                    var record = DB.get('giving', editId);
                    if (record) {
                        document.getElementById('recordId').value = record.id;
                        document.getElementById('typeSelect').value = 'giving';
                        document.getElementById('memberSelect').value = record.memberId || '';
                        document.getElementById('givingCategory').value = record.category || 'Tithe';
                        document.getElementById('amount').value = record.amount;
                        document.getElementById('date').value = record.date;
                        document.getElementById('paymentMethod').value = record.paymentMethod || 'Cash';
                        document.getElementById('receiptNumber').value = record.receiptNumber || '';
                        document.getElementById('notes').value = record.notes || '';
                        toggleFinanceForm();
                    }
                } else {
                    var record = DB.get('expenses', editId);
                    if (record) {
                        document.getElementById('recordId').value = record.id;
                        document.getElementById('typeSelect').value = 'expense';
                        document.getElementById('expenseCategory').value = record.category || 'Other';
                        document.getElementById('expenseDescription').value = record.description || '';
                        document.getElementById('amount').value = record.amount;
                        document.getElementById('date').value = record.date;
                        document.getElementById('paymentMethod').value = record.paymentMethod || 'Cash';
                        document.getElementById('receiptNumber').value = record.receiptNumber || '';
                        document.getElementById('notes').value = record.notes || '';
                        toggleFinanceForm();
                    }
                }
            }
        }

        // ============================================
        // FORM SUBMISSION
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Populate members
            populateMembers();

            // Set default date
            setDefaultDate();

            // Load edit data if any
            loadEditData();

            // Update badges
            document.getElementById('memberBadge').textContent = DB.getAll('members').length;
            document.getElementById('eventBadge').textContent = DB.getAll('events').filter(function(e) { return e.status === 'Upcoming'; }).length;
            document.getElementById('financeBadge').textContent = DB.getAll('giving').length;

            // Handle form submission
            document.getElementById('financeForm').addEventListener('submit', function(e) {
                e.preventDefault();

                var type = document.getElementById('recordType').value;
                var recordId = document.getElementById('recordId').value;
                var amount = parseFloat(document.getElementById('amount').value);
                var date = document.getElementById('date').value;
                var paymentMethod = document.getElementById('paymentMethod').value;
                var receiptNumber = document.getElementById('receiptNumber').value || 'RCP-' + Date.now().toString().slice(-6);
                var notes = document.getElementById('notes').value.trim();

                if (!amount || amount <= 0) {
                    showToast('Please enter a valid amount', 'error');
                    return;
                }

                if (!date) {
                    showToast('Please select a date', 'error');
                    return;
                }

                if (type === 'giving') {
                    var memberId = document.getElementById('memberSelect').value;
                    var member = DB.get('members', memberId);
                    var data = {
                        memberId: memberId || '',
                        memberName: member ? member.firstName + ' ' + member.lastName : 'Anonymous',
                        category: document.getElementById('givingCategory').value,
                        amount: amount,
                        date: date,
                        paymentMethod: paymentMethod,
                        receiptNumber: receiptNumber,
                        notes: notes
                    };

                    if (recordId) {
                        DB.update('giving', recordId, data);
                        showToast('Giving record updated successfully', 'success');
                    } else {
                        DB.add('giving', data);
                        showToast('Giving record added successfully', 'success');
                    }
                } else {
                    var data = {
                        category: document.getElementById('expenseCategory').value,
                        description: document.getElementById('expenseDescription').value.trim(),
                        amount: amount,
                        date: date,
                        paymentMethod: paymentMethod,
                        receiptNumber: receiptNumber,
                        notes: notes
                    };

                    if (recordId) {
                        DB.update('expenses', recordId, data);
                        showToast('Expense record updated successfully', 'success');
                    } else {
                        DB.add('expenses', data);
                        showToast('Expense record added successfully', 'success');
                    }
                }

                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1000);
            });
        });
    </script>
</body>
</html>
