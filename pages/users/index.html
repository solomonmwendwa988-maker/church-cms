<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Victory Life CMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="#" class="brand">
                <div class="logo-icon">✝</div>
                <span>Victory <span class="highlight">Life</span></span>
            </a>
        </div>
        <div class="header-right">
            <button id="installBtn" class="header-btn install-btn" style="display:none;" onclick="installApp()" title="Install App">
                <i class="fas fa-download"></i>
                <span class="install-label">Install</span>
            </button>
            <button class="header-btn" onclick="showNotification()" title="Notifications">
                <i class="fas fa-bell"></i>
                <span class="dot active" id="notifDot"></span>
            </button>
            <button class="header-btn" onclick="toggleTheme()" title="Toggle Theme" id="themeBtn">
                <i class="fas fa-moon"></i>
            </button>
            <button class="header-btn" onclick="logout()" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <div id="installBanner" class="install-banner" onclick="installApp()">
        <i class="fas fa-download"></i>
        <span style="margin:0 8px;">Install Victory Life CMS on your device</span>
        <button>Install Now</button>
        <span class="close-banner" onclick="event.stopPropagation();dismissInstallBanner()">×</span>
    </div>

    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <button class="nav-item" data-page="dashboard" onclick="window.location.href='../dashboard/index.html'">
                <i class="fas fa-chart-pie"></i> Dashboard
            </button>
            <button class="nav-item" data-page="members" onclick="window.location.href='../members/index.html'">
                <i class="fas fa-users"></i> Members
                <span class="badge" id="memberBadge">0</span>
            </button>
            <button class="nav-item" data-page="attendance" onclick="window.location.href='../attendance/index.html'">
                <i class="fas fa-clipboard-check"></i> Attendance
            </button>
            <button class="nav-item" data-page="finance" onclick="window.location.href='../finance/index.html'">
                <i class="fas fa-coins"></i> Finance
                <span class="badge" id="financeBadge">0</span>
            </button>
            <button class="nav-item" data-page="events" onclick="window.location.href='../events/index.html'">
                <i class="fas fa-calendar-alt"></i> Events
                <span class="badge" id="eventBadge">0</span>
            </button>
            <button class="nav-item" data-page="sermons" onclick="window.location.href='../sermons/index.html'">
                <i class="fas fa-bible"></i> Sermons
                <span class="badge" id="sermonBadge">0</span>
            </button>
            <button class="nav-item" data-page="analytics" onclick="window.location.href='../analytics/index.html'">
                <i class="fas fa-chart-line"></i> Analytics
                <span class="ai-badge">AI</span>
            </button>
            <button class="nav-item" data-page="mpesa" onclick="window.location.href='../mpesa/index.html'">
                <i class="fas fa-mobile-alt"></i> M-Pesa
                <span class="badge" id="mpesaBadge">0</span>
            </button>
            <button class="nav-item active" data-page="users" onclick="window.location.href='index.html'">
                <i class="fas fa-user-cog"></i> Users
                <span class="badge" id="userBadge">0</span>
            </button>
            <button class="nav-item" data-page="media" onclick="window.location.href='../media/index.html'">
                <i class="fas fa-photo-video"></i> Media
                <span class="badge" id="mediaBadge">0</span>
            </button>
            <button class="nav-item" data-page="notifications" onclick="window.location.href='../notifications/index.html'">
                <i class="fas fa-bell"></i> Notifications
                <span class="badge" id="notifBadge">0</span>
            </button>
            <button class="nav-item" data-page="reports" onclick="window.location.href='../reports/index.html'">
                <i class="fas fa-file-alt"></i> Reports
            </button>
            <button class="nav-item" data-page="settings" onclick="window.location.href='../settings/index.html'">
                <i class="fas fa-cog"></i> Settings
            </button>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="user-avatar" id="userAvatar">AD</div>
                <div class="user-info">
                    <span class="user-name" id="userName">Admin User</span>
                    <span class="user-role" id="userRole">Administrator</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="topbar">
            <button class="menu-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div>
                <span class="page-title">User Management</span>
                <span class="page-subtitle">Manage system users and roles</span>
            </div>
        </div>

        <div style="margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;">
            <button class="btn-primary" onclick="openAddUserModal()">
                <i class="fas fa-plus"></i> Add User
            </button>
            <button class="btn-secondary" onclick="refreshUsers()">
                <i class="fas fa-sync"></i> Refresh
            </button>
        </div>

        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-users-cog"></i> System Users</h3>
                <span style="font-size:0.85rem;color:var(--text-secondary);">Total: <span id="userTotal">0</span></span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable"></tbody>
                </table>
            </div>
        </div>

        <div class="footer">
            Victory Life International &bull; Church Management System v2.0
        </div>
    </main>

    <!-- Add User Modal -->
    <div class="modal-overlay" id="addUserModal">
        <div class="modal">
            <h2>Add New User</h2>
            <form id="addUserForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="userName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="userEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="userPassword" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="userRole">
                        <option value="admin">Administrator</option>
                        <option value="pastor">Pastor</option>
                        <option value="secretary">Secretary</option>
                        <option value="cashier">Cashier</option>
                        <option value="member">Member</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal('addUserModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Add User</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script src="../../assets/js/data.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/permissions.js"></script>
    <script src="../../assets/js/sync.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        // ============================================
        // RENDER USERS
        // ============================================
        function renderUsers() {
            const users = DB.getAll('users');
            const table = document.getElementById('usersTable');

            document.getElementById('userTotal').textContent = users.length;
            document.getElementById('userBadge').textContent = users.length;

            if (users.length === 0) {
                table.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted);">No users found</td></tr>';
                return;
            }

            const roleColors = {
                admin: '#ef4444',
                pastor: '#3b82f6',
                secretary: '#8b5cf6',
                cashier: '#22c55e',
                member: '#64748b'
            };

            table.innerHTML = users.map(function(u) {
                return `
                    <tr>
                        <td><strong>${u.name}</strong></td>
                        <td>${u.email}</td>
                        <td><span style="color:${roleColors[u.role] || '#64748b'};font-weight:600;text-transform:capitalize;">${ROLES[u.role]?.label || u.role}</span></td>
                        <td><span class="item-status ${u.status === 'active' ? 'active' : 'pending'}">${u.status}</span></td>
                        <td>
                            <button class="btn-sm" onclick="editUser('${u.id}')">Edit</button>
                            <button class="btn-sm" onclick="deleteUser('${u.id}')" style="color:var(--danger);">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ============================================
        // ADD USER
        // ============================================
        function openAddUserModal() {
            document.getElementById('addUserModal').classList.add('active');
        }

        document.getElementById('addUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const password = document.getElementById('userPassword').value.trim();
            const role = document.getElementById('userRole').value;

            if (!name || !email || !password) {
                showToast('Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch('https://church-cms-api-11h5.onrender.com/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to create user');
                }

                showToast('User created successfully', 'success');
                closeModal('addUserModal');
                document.getElementById('addUserForm').reset();
                renderUsers();
                updateBadges();

            } catch (error) {
                showToast(error.message, 'error');
            }
        });

        // ============================================
        // DELETE USER
        // ============================================
        function deleteUser(id) {
            if (confirm('Delete this user?')) {
                DB.delete('users', id);
                renderUsers();
                updateBadges();
                showToast('User deleted', 'info');
            }
        }

        // ============================================
        // REFRESH USERS
        // ============================================
        function refreshUsers() {
            Sync.loadDataFromServer();
            renderUsers();
            showToast('Users refreshed', 'success');
        }

        // ============================================
        // UPDATE BADGES
        // ============================================
        function updateBadges() {
            document.getElementById('memberBadge').textContent = DB.getAll('members').length;
            document.getElementById('eventBadge').textContent = DB.getAll('events').filter(e => e.status === 'Upcoming').length;
            document.getElementById('financeBadge').textContent = DB.getAll('giving').length;
            document.getElementById('userBadge').textContent = DB.getAll('users').length;
            document.getElementById('mediaBadge').textContent = DB.getAll('media').length;
            document.getElementById('sermonBadge').textContent = DB.getAll('sermons').length;
            document.getElementById('mpesaBadge').textContent = DB.getAll('mpesaTransactions').length;
            document.getElementById('notifBadge').textContent = DB.getAll('notifications').filter(n => n.status === 'pending').length;
        }

        // ============================================
        // CLOSE MODAL
        // ============================================
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        document.querySelectorAll('.modal-overlay').forEach(function(modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });

        // ============================================
        // INIT
        // ============================================
        (function() {
            if (!isAuthenticated()) {
                window.location.href = '../auth/login.html';
                return;
            }
            updateSidebarUser();
            renderUsers();
            updateBadges();
            Sync.init();
            applyPermissions();
        })();
    </script>
</body>
</html>
