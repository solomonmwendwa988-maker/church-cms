<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event - Victory Life CMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="#" class="brand">
                <div class="logo-icon">✝</div>
                <span>Victory <span class="highlight">Life</span></span>
            </a>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="showNotification()" title="Notifications">
                <i class="fas fa-bell"></i>
                <span class="dot active" id="notifDot"></span>
            </button>
            <button class="header-btn" onclick="toggleTheme()" title="Toggle Theme" id="themeBtn">
                <i class="fas fa-moon"></i>
            </button>
            <a href="../auth/login.html" class="header-btn" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </a>
        </div>
    </header>

    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <button class="nav-item" data-page="dashboard" onclick="window.location.href='../dashboard/index.html'">
                <i class="fas fa-chart-pie"></i> Dashboard
            </button>
            <button class="nav-item" data-page="members" onclick="window.location.href='../members/index.html'">
                <i class="fas fa-users"></i> Members
                <span class="badge" id="memberBadge">0</span>
            </button>
            <button class="nav-item" data-page="attendance" onclick="window.location.href='../attendance/index.html'">
                <i class="fas fa-clipboard-check"></i> Attendance
            </button>
            <button class="nav-item" data-page="finance" onclick="window.location.href='../finance/index.html'">
                <i class="fas fa-coins"></i> Finance
                <span class="badge" id="financeBadge">0</span>
            </button>
            <button class="nav-item active" data-page="events" onclick="window.location.href='index.html'">
                <i class="fas fa-calendar-alt"></i> Events
                <span class="badge" id="eventBadge">0</span>
            </button>
            <button class="nav-item" data-page="reports" onclick="window.location.href='../reports/index.html'">
                <i class="fas fa-file-alt"></i> Reports
            </button>
            <button class="nav-item" data-page="settings" onclick="window.location.href='../settings/index.html'">
                <i class="fas fa-cog"></i> Settings
            </button>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="user-avatar">AD</div>
                <div class="user-info">
                    <span class="user-name">Admin User</span>
                    <span class="user-role">Administrator</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="topbar">
            <button class="menu-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div>
                <span class="page-title" id="pageTitle">Create Event</span>
                <span class="page-subtitle">Create a new church event</span>
            </div>
        </div>

        <div class="card">
            <form id="eventForm">
                <input type="hidden" id="eventId" value="">

                <div class="form-group">
                    <label>Event Title</label>
                    <input type="text" id="title" required placeholder="e.g., Youth Conference 2026">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" placeholder="Event description..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category">
                            <option value="Conference">Conference</option>
                            <option value="Service">Service</option>
                            <option value="Meeting">Meeting</option>
                            <option value="Outreach">Outreach</option>
                            <option value="Training">Training</option>
                            <option value="Fellowship">Fellowship</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="Upcoming">Upcoming</option>
                            <option value="Ongoing">Ongoing</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" id="endDate" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" id="startTime">
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" id="endTime">
                    </div>
                </div>

                <div class="form-group">
                    <label>Venue</label>
                    <input type="text" id="venue" placeholder="Event venue">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Capacity</label>
                        <input type="number" id="capacity" placeholder="Maximum attendees">
                    </div>
                    <div class="form-group">
                        <label>Speaker</label>
                        <input type="text" id="speaker" placeholder="Guest speaker name">
                    </div>
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" placeholder="Additional notes..."></textarea>
                </div>

                <div style="display:flex;gap:12px;margin-top:8px;">
                    <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save Event</button>
                    <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
            </form>
        </div>

        <div class="footer">
            Victory Life International &bull; Church Management System v2.0
        </div>
    </main>

    <div id="toastContainer"></div>
    <script>
    // ============================================
    // AUTHENTICATION CHECK - RUNS FIRST
    // ============================================
    (function checkAuth() {
        // If not authenticated, redirect to login
        if (!isAuthenticated()) {
            window.location.href = '../auth/login.html';
            return;
        }

        // Update user info in sidebar
        var user = getCurrentUser();
        if (user) {
            var avatarEl = document.getElementById('userAvatar');
            var nameEl = document.getElementById('userName');
            var roleEl = document.getElementById('userRole');

            if (avatarEl) avatarEl.textContent = user.avatar || user.name.charAt(0).toUpperCase();
            if (nameEl) nameEl.textContent = user.name || 'Admin User';
            if (roleEl) roleEl.textContent = user.role ? user.role.charAt(0).toUpperCase() + user.role.slice(1) : 'Administrator';

            var subtitleEl = document.getElementById('pageSubtitle');
            if (subtitleEl) subtitleEl.textContent = 'Welcome back, ' + (user.name || 'Admin');
        }
    })();
</script>
    <script src="../../assets/js/data.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        // ============================================
        // SET DEFAULT DATES
        // ============================================
        function setDefaultDates() {
            var today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = today;
        }

        // ============================================
        // LOAD EDIT DATA
        // ============================================
        function loadEditData() {
            var urlParams = new URLSearchParams(window.location.search);
            var editId = urlParams.get('id');

            if (editId) {
                document.getElementById('pageTitle').textContent = 'Edit Event';
                document.getElementById('pageSubtitle').textContent = 'Update event details';

                var event = DB.get('events', editId);
                if (event) {
                    document.getElementById('eventId').value = event.id;
                    document.getElementById('title').value = event.title || '';
                    document.getElementById('description').value = event.description || '';
                    document.getElementById('category').value = event.category || 'Conference';
                    document.getElementById('status').value = event.status || 'Upcoming';
                    document.getElementById('startDate').value = event.startDate || '';
                    document.getElementById('endDate').value = event.endDate || '';
                    document.getElementById('startTime').value = event.startTime || '';
                    document.getElementById('endTime').value = event.endTime || '';
                    document.getElementById('venue').value = event.venue || '';
                    document.getElementById('capacity').value = event.capacity || '';
                    document.getElementById('speaker').value = event.speaker || '';
                    document.getElementById('notes').value = event.notes || '';
                }
            }
        }

        // ============================================
        // FORM SUBMISSION
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            setDefaultDates();
            loadEditData();

            // Update badges
            document.getElementById('memberBadge').textContent = DB.getAll('members').length;
            document.getElementById('eventBadge').textContent = DB.getAll('events').filter(function(e) { return e.status === 'Upcoming'; }).length;
            document.getElementById('financeBadge').textContent = DB.getAll('giving').length;

            document.getElementById('eventForm').addEventListener('submit', function(e) {
                e.preventDefault();

                var title = document.getElementById('title').value.trim();
                var startDate = document.getElementById('startDate').value;
                var endDate = document.getElementById('endDate').value;

                if (!title) {
                    showToast('Please enter an event title', 'error');
                    return;
                }

                if (!startDate || !endDate) {
                    showToast('Please select start and end dates', 'error');
                    return;
                }

                var data = {
                    title: title,
                    description: document.getElementById('description').value.trim(),
                    category: document.getElementById('category').value,
                    status: document.getElementById('status').value,
                    startDate: startDate,
                    endDate: endDate,
                    startTime: document.getElementById('startTime').value,
                    endTime: document.getElementById('endTime').value,
                    venue: document.getElementById('venue').value.trim(),
                    capacity: parseInt(document.getElementById('capacity').value) || 0,
                    speaker: document.getElementById('speaker').value.trim(),
                    notes: document.getElementById('notes').value.trim(),
                    registered: 0
                };

                var eventId = document.getElementById('eventId').value;

                if (eventId) {
                    DB.update('events', eventId, data);
                    showToast('Event updated successfully', 'success');
                } else {
                    DB.add('events', data);
                    showToast('Event created successfully', 'success');
                }

                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1000);
            });
        });
    </script>
</body>
</html>
