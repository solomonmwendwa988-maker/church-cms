<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Events - Victory Life CMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="#" class="brand">
                <div class="logo-icon">✝</div>
                <span>Victory <span class="highlight">Life</span></span>
            </a>
        </div>
        <div class="header-right">
            <button id="installBtn" class="header-btn install-btn" onclick="installApp()" title="Install App">
    <i class="fas fa-download"></i>
    <span class="install-label">Install</span>
</button>
            <button class="header-btn" onclick="showNotification()" title="Notifications">
                <i class="fas fa-bell"></i>
                <span class="dot active" id="notifDot"></span>
            </button>
            <button class="header-btn" onclick="toggleTheme()" title="Toggle Theme" id="themeBtn">
                <i class="fas fa-moon"></i>
            </button>
            <button class="header-btn" onclick="logout()" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <div id="installBanner" class="install-banner" onclick="installApp()">
        <i class="fas fa-download"></i>
        <span style="margin:0 8px;">Install Victory Life CMS on your device</span>
        <button>Install Now</button>
        <span class="close-banner" onclick="event.stopPropagation();dismissInstallBanner()">×</span>
    </div>
    <!-- Online Users Widget -->
<div id="onlineUsers" style="display:flex;align-items:center;gap:8px;padding:4px 12px;background:var(--bg);border-radius:20px;font-size:0.85rem;margin-bottom:16px;">
    <span style="color:var(--success);">●</span>
    <span>0 online</span>
</div>

    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <button class="nav-item" data-page="dashboard" onclick="window.location.href='../dashboard/index.html'">
                <i class="fas fa-chart-pie"></i> Dashboard
            </button>
            <button class="nav-item" data-page="members" onclick="window.location.href='../members/index.html'">
                <i class="fas fa-users"></i> Members
                <span class="badge" id="memberBadge">0</span>
            </button>
            <button class="nav-item" data-page="attendance" onclick="window.location.href='../attendance/index.html'">
                <i class="fas fa-clipboard-check"></i> Attendance
            </button>
            <button class="nav-item" data-page="finance" onclick="window.location.href='../finance/index.html'">
                <i class="fas fa-coins"></i> Finance
                <span class="badge" id="financeBadge">0</span>
            </button>
            <button class="nav-item active" data-page="events" onclick="window.location.href='index.html'">
                <i class="fas fa-calendar-alt"></i> Events
                <span class="badge" id="eventBadge">0</span>
            </button>
            <button class="nav-item" data-page="sermons" onclick="window.location.href='../sermons/index.html'">
                <i class="fas fa-bible"></i> Sermons
                <span class="badge" id="sermonBadge">0</span>
            </button>
            <button class="nav-item" data-page="media" onclick="window.location.href='../media/index.html'">
                <i class="fas fa-photo-video"></i> Media
                <span class="badge" id="mediaBadge">0</span>
            </button>
            <button class="nav-item" data-page="notifications" onclick="window.location.href='../notifications/index.html'">
                <i class="fas fa-bell"></i> Notifications
                <span class="badge" id="notifBadge">0</span>
            </button>
            <!-- Add this after Media or Analytics -->
            <button class="nav-item" data-page="users" onclick="window.location.href='../users/index.html'">
                <i class="fas fa-user-cog"></i> Users
                <span class="badge" id="userBadge">0</span>
            </button>
            <button class="nav-item" data-page="reports" onclick="window.location.href='../reports/index.html'">
                <i class="fas fa-file-alt"></i> Reports
            </button>
            <button class="nav-item" data-page="settings" onclick="window.location.href='../settings/index.html'">
                <i class="fas fa-cog"></i> Settings
            </button>
        </nav>
        <div class="sidebar-footer">
    <div class="user-card">
        <div class="user-avatar" id="userAvatar">AD</div>
        <div class="user-info">
            <span class="user-name" id="userName">Admin User</span>
            <span class="user-role" id="userRole">Administrator</span>
        </div>
        <span id="userRoleBadge" style="font-size:0.6rem;padding:2px 8px;border-radius:12px;border:1px solid var(--primary);color:var(--primary);">Admin</span>
    </div>
</div>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="topbar">
            <button class="menu-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div>
                <span class="page-title">Events</span>
                <span class="page-subtitle">Manage events with calendar view</span>
            </div>
        </div>

        <div style="margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;">
            <button class="btn-primary" onclick="window.location.href='add.html'">
                <i class="fas fa-plus"></i> Create Event
            </button>
            <button class="btn-secondary" onclick="window.location.href='../events/calendar.html'">
                <i class="fas fa-calendar-alt"></i> Calendar View
            </button>
            <button class="btn-secondary" onclick="EventsModule.requestPermission()">
                <i class="fas fa-bell"></i> Enable Notifications
            </button>
            <button class="btn-secondary" onclick="EventsModule.sendReminder('${eventId}')">
                <i class="fas fa-envelope"></i> Send Reminder
            </button>
        </div>

        <div id="pageContent">
            <!-- Content loaded by JavaScript -->
        </div>

        <div class="footer">
            Victory Life International &bull; Church Management System v2.0
        </div>
    </main>

    <div id="toastContainer"></div>

    <script src="../../assets/js/data.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/modules/events.js"></script>
    <script src="../../assets/js/app.js"></script>

    <script>
        (function() {
            if (!isAuthenticated()) {
                window.location.href = '../auth/login.html';
                return;
            }
            updateSidebarUser();

            const container = document.getElementById('pageContent');
            if (container) {
                // Show calendar in the page content
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="fas fa-calendar-alt"></i> Event Calendar</h3>
                            <span style="font-size:0.85rem;color:var(--text-secondary);">Click a date to see events</span>
                        </div>
                        <div id="calendarContainer"></div>
                    </div>
                    <div class="card" style="margin-top:20px;">
                        <div class="card-header">
                            <h3><i class="fas fa-tags"></i> Event Categories</h3>
                        </div>
                        <div id="categoriesContainer"></div>
                    </div>
                    <div class="card" style="margin-top:20px;">
                        <div class="card-header">
                            <h3><i class="fas fa-list"></i> Upcoming Events</h3>
                            <button class="card-action" onclick="window.location.href='add.html'">Add Event</button>
                        </div>
                        <div id="upcomingEventsList"></div>
                    </div>
                `;

                // Render calendar
                const calendarContainer = document.getElementById('calendarContainer');
                if (calendarContainer) {
                    EventsModule.renderCalendar(calendarContainer);
                }

                // Render categories
                const categoriesContainer = document.getElementById('categoriesContainer');
                if (categoriesContainer) {
                    EventsModule.renderCategories(categoriesContainer);
                }

                // Render upcoming events
                const upcomingContainer = document.getElementById('upcomingEventsList');
                if (upcomingContainer) {
                    const upcoming = EventsModule.getUpcomingEvents(30);
                    if (upcoming.length === 0) {
                        upcomingContainer.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">No upcoming events</div>';
                    } else {
                        upcomingContainer.innerHTML = upcoming.map(function(e) {
                            const color = EventsModule.getCategoryColor(e.category);
                            return `
                                <div class="item" style="border-left:3px solid ${color};">
                                    <div class="item-icon"><i class="fas ${EventsModule.getCategoryIcon(e.category)}" style="color:${color};"></i></div>
                                    <div class="item-content">
                                        <div class="item-title">${e.title}</div>
                                        <div class="item-meta">${formatDate(e.startDate)} · ${e.startTime || 'N/A'} · ${e.venue || 'N/A'}</div>
                                    </div>
                                    <div style="display:flex;gap:4px;">
                                        <button class="btn-sm" onclick="EventsModule.sendReminder('${e.id}')" title="Send Reminder"><i class="fas fa-bell"></i></button>
                                        <button class="btn-sm" onclick="window.location.href='add.html?id=${e.id}'">Edit</button>
                                        <button class="btn-sm" onclick="deleteEvent('${e.id}')" style="color:var(--danger);">Delete</button>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    }
                }
            }

            // Update badges
            document.getElementById('eventBadge').textContent = DB.getAll('events').filter(function(e) { return e.status === 'Upcoming'; }).length;
            document.getElementById('memberBadge').textContent = DB.getAll('members').length;
            document.getElementById('financeBadge').textContent = DB.getAll('giving').length;
            document.getElementById('mediaBadge').textContent = DB.getAll('media').length;
            document.getElementById('sermonBadge').textContent = DB.getAll('sermons').length;
            document.getElementById('notifBadge').textContent = DB.getAll('notifications').filter(function(n) { return n.status === 'pending'; }).length;
        })();
    </script>
</body>
</html>
