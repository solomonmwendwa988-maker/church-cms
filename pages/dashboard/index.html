<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Victory Life CMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="#" class="brand">
                <div class="logo-icon">✝</div>
                <span>Victory <span class="highlight">Life</span></span>
            </a>
        </div>
        <div class="header-right">
            <button id="installBtn" class="header-btn install-btn" style="display:none;" onclick="installApp()" title="Install App">
                <i class="fas fa-download"></i>
                <span class="install-label">Install</span>
            </button>
            <button class="header-btn" onclick="showNotification()" title="Notifications">
                <i class="fas fa-bell"></i>
                <span class="dot active" id="notifDot"></span>
            </button>
            <button class="header-btn" onclick="toggleTheme()" title="Toggle Theme" id="themeBtn">
                <i class="fas fa-moon"></i>
            </button>
            <button class="header-btn" onclick="logout()" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <div id="installBanner" class="install-banner" onclick="installApp()">
        <i class="fas fa-download"></i>
        <span style="margin:0 8px;">Install Victory Life CMS on your device</span>
        <button>Install Now</button>
        <span class="close-banner" onclick="event.stopPropagation();dismissInstallBanner()">×</span>
    </div>

    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <button class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
                <i class="fas fa-chart-pie"></i> Dashboard
            </button>
            <button class="nav-item" data-page="members" onclick="navigateTo('members')">
                <i class="fas fa-users"></i> Members
                <span class="badge" id="memberBadge">0</span>
            </button>
            <button class="nav-item" data-page="attendance" onclick="navigateTo('attendance')">
                <i class="fas fa-clipboard-check"></i> Attendance
            </button>
            <button class="nav-item" data-page="finance" onclick="navigateTo('finance')">
                <i class="fas fa-coins"></i> Finance
                <span class="badge" id="financeBadge">0</span>
            </button>
            <button class="nav-item" data-page="events" onclick="navigateTo('events')">
                <i class="fas fa-calendar-alt"></i> Events
                <span class="badge" id="eventBadge">0</span>
            </button>
            <button class="nav-item" data-page="media" onclick="navigateTo('media')">
                <i class="fas fa-photo-video"></i> Media
                <span class="badge" id="mediaBadge">0</span>
            </button>
            <!-- Add to sidebar navigation -->
            <button class="nav-item" data-page="analytics" onclick="window.location.href='../analytics/index.html'">
                <i class="fas fa-chart-line"></i> Analytics
                <span class="ai-badge">AI</span>
            </button>
            <button class="nav-item" data-page="mpesa" onclick="window.location.href='../mpesa/index.html'">
                <i class="fas fa-mobile-alt"></i> M-Pesa
                <span class="badge" id="mpesaBadge">0</span>
            </button>
            <button class="nav-item" data-page="reports" onclick="navigateTo('reports')">
                <i class="fas fa-file-alt"></i> Reports
            </button>
            <button class="nav-item" data-page="settings" onclick="navigateTo('settings')">
                <i class="fas fa-cog"></i> Settings
            </button>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="user-avatar" id="userAvatar">AD</div>
                <div class="user-info">
                    <span class="user-name" id="userName">Admin User</span>
                    <span class="user-role" id="userRole">Administrator</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="topbar">
            <button class="menu-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div>
                <span class="page-title" id="pageTitle">Dashboard</span>
                <span class="page-subtitle" id="pageSubtitle">Welcome back, Admin</span>
            </div>
        </div>

        <div id="pageContent"></div>

        <div class="footer">
            Victory Life International &bull; Church Management System v2.0
        </div>
    </main>

    <div id="toastContainer"></div>

    <script src="../../assets/js/data.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/app.js"></script>

    <script>
        // ============================================
        // AUTHENTICATION CHECK
        // ============================================
        (function() {
            if (!isAuthenticated()) {
                window.location.href = '../auth/login.html';
                return;
            }
            updateSidebarUser();
        })();
    </script>

</body>
</html>
