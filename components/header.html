<!-- HEADER COMPONENT -->
<header class="header">
    <div class="header-left">
        <a href="#" class="brand">
            <div class="logo-icon">✝</div>
            <span>Victory <span class="highlight">Life</span></span>
        </a>
    </div>
    <div class="header-right">
        <!-- INSTALL BUTTON -->
        <button id="installBtn" class="header-btn install-btn" style="display:none;" onclick="installApp()" title="Install App">
            <i class="fas fa-download"></i>
            <span class="install-label">Install</span>
        </button>

        <button class="header-btn" onclick="showNotification()" title="Notifications">
            <i class="fas fa-bell"></i>
            <span class="dot active" id="notifDot"></span>
        </button>
        <button class="header-btn" onclick="toggleTheme()" title="Toggle Theme" id="themeBtn">
            <i class="fas fa-moon"></i>
        </button>
        <a href="../auth/login.html" class="header-btn" title="Logout">
            <i class="fas fa-sign-out-alt"></i>
        </a>
    </div>
</header>

<!-- Install Banner -->
<div id="installBanner" style="display:none;background:var(--primary);color:white;padding:10px 16px;text-align:center;position:relative;z-index:98;font-size:0.85rem;cursor:pointer;" onclick="installApp()">
    <i class="fas fa-download"></i>
    <span style="margin:0 8px;">Install Victory Life CMS on your device</span>
    <span style="background:white;color:var(--primary);padding:2px 14px;border-radius:20px;font-weight:600;font-size:0.75rem;">Install</span>
    <button onclick="event.stopPropagation();dismissInstallBanner()" style="background:transparent;color:white;border:none;cursor:pointer;font-size:1.2rem;position:absolute;right:12px;top:50%;transform:translateY(-50%);">×</button>
</div>
